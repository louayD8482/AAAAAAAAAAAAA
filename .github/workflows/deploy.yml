name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install

      - name: Verify native build binaries resolved correctly
        run: node -e "require.resolve('lightningcss'); console.log('lightningcss OK')"

      - name: Build Web Assets
        run: bun run build

      - name: Install Capacitor CLI
        run: bun add @capacitor/cli @capacitor/core @capacitor/ios

      - name: Add Capacitor iOS Platform
        run: |
          if [ -d "ios" ]; then
            echo "ios/ already exists in repo — skipping cap add"
          else
            bunx cap add ios
          fi

      - name: Sync Capacitor iOS
        run: bunx cap sync ios

      - name: Install Pillow for icon processing
        run: pip3 install --break-system-packages pillow

      - name: Fix App Store icon (resize to 1024x1024, remove alpha)
        run: |
          ICON="ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png"
          sips -s format png --resampleHeightWidth 1024 1024 "$ICON" --out "$ICON"
          python3 -c "
from PIL import Image
img = Image.open('$ICON')
if img.mode in ('RGBA', 'LA') or (img.mode == 'P' and 'transparency' in img.info):
    bg = Image.new('RGB', img.size, (255, 255, 255))
    img = img.convert('RGBA')
    bg.paste(img, mask=img.split()[-1])
    bg.save('$ICON')
    print('Alpha removed')
else:
    img.convert('RGB').save('$ICON')
    print('No alpha channel found, saved as RGB')
"

      - name: Build Xcode Archive
        run: |
          cd ios
          if [ -d "App" ]; then cd App; fi
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | head -n 1)
          if [ -z "$WORKSPACE" ]; then
            PROJECT=$(ls -d *.xcodeproj 2>/dev/null | head -n 1)
            xcodebuild -project "$PROJECT" -scheme App -configuration Release -archivePath build/App.xcarchive archive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO
          else
            xcodebuild -workspace "$WORKSPACE" -scheme App -configuration Release -archivePath build/App.xcarchive archive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO
          fi

      - name: Upload iOS Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive
          path: ios/**/build/App.xcarchive
