name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/cli@latest @capacitor/core@latest @capacitor/ios@latest @capacitor/status-bar@latest

      - name: Build Web App
        run: npm run build

      - name: Create Capacitor Config File
        run: |
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.louay.app",
            "appName": "Louay App",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "ios": {
              "minDeploymentTarget": "14.0"
            },
            "plugins": {
              "StatusBar": {
                "overlaysWebView": false,
                "style": "DARK",
                "backgroundColor": "#ffffff"
              }
            }
          }
          EOF

      - name: Add and Sync iOS Platform
        run: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios

      - name: Create Perfect Podfile
        run: |
          cd ios/App
          echo "platform :ios, '14.0'" > Podfile
          echo "use_frameworks!" > Podfile
          echo "" >> Podfile
          echo "target 'App' do" >> Podfile
          echo "  pod 'Capacitor', :path => '../../node_modules/@capacitor/ios'" >> Podfile
          echo "  pod 'CapacitorCordova', :path => '../../node_modules/@capacitor/ios'" >> Podfile
          echo "  pod 'CapacitorStatusBar', :path => '../../node_modules/@capacitor/status-bar'" >> Podfile
          echo "end" >> Podfile
          pod install --repo-update
          cd ../..

      - name: Build Xcode Archive
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -sdk iphoneos -configuration Release archive -archivePath $PWD/build/App.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          cd ../..

      - name: Export IPA
        run: |
          mkdir -p payload
          mv ios/App/build/App.xcarchive/Products/Applications/App.app payload/
          cd payload
          zip -r ../App.ipa App.app
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: App.ipa
