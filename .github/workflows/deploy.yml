name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --include=optional --no-audit --no-fund

      # npm can omit lightningcss optional platform packages on macOS.
      # Install the runner's exact native binary explicitly before Vite runs.
      - name: Ensure lightningcss Darwin binary
        shell: bash
        run: |
          LIGHTNINGCSS_VERSION=$(node -p "require('./node_modules/lightningcss/package.json').version")
          if [ "$(uname -m)" = "arm64" ]; then
            npm install --no-save --include=optional "lightningcss-darwin-arm64@${LIGHTNINGCSS_VERSION}"
          else
            npm install --no-save --include=optional "lightningcss-darwin-x64@${LIGHTNINGCSS_VERSION}"
          fi

          TAILWIND_OXIDE_VERSION=$(node -p "require('./node_modules/@tailwindcss/oxide/package.json').version")
          if [ "$(uname -m)" = "arm64" ]; then
            npm install --no-save --include=optional "@tailwindcss/oxide-darwin-arm64@${TAILWIND_OXIDE_VERSION}"
          else
            npm install --no-save --include=optional "@tailwindcss/oxide-darwin-x64@${TAILWIND_OXIDE_VERSION}"
          fi

      - name: Build Web Assets
        run: npm run build

      - name: Install Capacitor CLI
        run: npm install @capacitor/cli @capacitor/core @capacitor/ios

      - name: Add Capacitor iOS Platform
        run: npx cap add ios

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build Xcode Archive
        run: |
          cd ios
          if [ -d "App" ]; then cd App; fi
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | head -n 1)
          if [ -z "$WORKSPACE" ]; then
            PROJECT=$(ls -d *.xcodeproj 2>/dev/null | head -n 1)
            xcodebuild -project "$PROJECT" -scheme App -configuration Release -archivePath build/App.xcarchive archive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO
          else
            xcodebuild -workspace "$WORKSPACE" -scheme App -configuration Release -archivePath build/App.xcarchive archive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO
          fi

      - name: Upload iOS Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive
          path: ios/**/build/App.xcarchive
