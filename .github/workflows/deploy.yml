name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update npm
        run: npm install -g npm@latest

      # Delete the lockfile and let npm resolve optionalDependencies
      # (lightningcss / @tailwindcss/oxide native binaries) fresh, against
      # this exact runner's OS/arch. This is the reliable fix for the
      # "Cannot find module '../lightningcss.darwin-arm64.node'" error —
      # it happens when the committed lockfile was generated on a different
      # platform and npm ends up skipping the correct native binary.
      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npm install --include=optional --no-audit --no-fund

      - name: Verify native build binaries resolved correctly
        run: |
          node -e "require.resolve('lightningcss'); console.log('lightningcss OK')"

      - name: Build Web Assets
        run: npm run build

      - name: Install Capacitor CLI
        run: npm install @capacitor/cli @capacitor/core @capacitor/ios

      - name: Add Capacitor iOS Platform
        run: npx cap add ios

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build Xcode Archive
        run: |
          cd ios
          if [ -d "App" ]; then cd App; fi
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | head -n 1)
          if [ -z "$WORKSPACE" ]; then
            PROJECT=$(ls -d *.xcodeproj 2>/dev/null | head -n 1)
            xcodebuild -project "$PROJECT" -scheme App -configuration Release -archivePath build/App.xcarchive archive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO
          else
            xcodebuild -workspace "$WORKSPACE" -scheme App -configuration Release -archivePath build/App.xcarchive archive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO
          fi

      - name: Upload iOS Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive
          path: ios/**/build/App.xcarchive
