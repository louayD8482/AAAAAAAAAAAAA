name: Build iOS App (IPA & Xcode Archive)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build & Package iOS Application
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Install Capacitor CLI
        run: npm install @capacitor/cli @capacitor/core @capacitor/ios

      - name: Sync Capacitor iOS Platform
        run: npx cap sync ios

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app || true

      - name: Resolve Swift Package Dependencies
        run: |
          cd ios/App
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -clonedSourcePackagesDirPath DerivedData/SourcePackages || true

      - name: Build Xcode Archive (CI Safe)
        run: |
          cd ios/App
          mkdir -p build
          
          # Build Archive using generic iOS destination and CI signing bypass
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/App.xcarchive \
            -derivedDataPath build/DerivedData \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package IPA from Archive
        run: |
          cd ios/App/build
          mkdir -p Payload
          
          # Find compiled .app bundle
          APP_PATH=$(find App.xcarchive/Products/Applications -name "*.app" -maxdepth 1 | head -n 1)
          
          if [ -d "$APP_PATH" ]; then
            echo "Found compiled app at: $APP_PATH"
            cp -R "$APP_PATH" Payload/
            zip -r -q Noor_Al_Islam_Unsigned.ipa Payload
            echo "Successfully generated Noor_Al_Islam_Unsigned.ipa"
          else
            echo "App bundle not found in archive products"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Noor_Al_Islam_iOS_IPA
          path: ios/App/build/Noor_Al_Islam_Unsigned.ipa
          retention-days: 14

      - name: Upload Xcode Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Noor_Al_Islam_Xcode_Archive
          path: ios/App/build/App.xcarchive
          retention-days: 14
