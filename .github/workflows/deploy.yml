      - name: Build Xcode Archive
        shell: bash
        run: |
          set -o pipefail
          cd ios
          if [ -d "App" ]; then cd App; fi
          WORKSPACE=<LaTex>(find . -maxdepth 1 -name "*.xcworkspace" -print -quit)           PROJECT=</LaTex>(find . -maxdepth 1 -name "*.xcodeproj" -print -quit)

          if [ -n "<LaTex>WORKSPACE" ]; then             xcodebuild archive \               -workspace "</LaTex>WORKSPACE" \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -archivePath "<LaTex>PWD/build/App.xcarchive" \               CODE_SIGNING_ALLOWED=NO \               CODE_SIGNING_REQUIRED=NO \               COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee "</LaTex>PWD/xcodebuild.log"
          else
            xcodebuild archive \
              -project "<LaTex>PROJECT" \               -scheme App \               -configuration Release \               -sdk iphoneos \               -destination 'generic/platform=iOS' \               -archivePath "</LaTex>PWD/build/App.xcarchive" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee "$PWD/xcodebuild.log"
          fi

      - name: Upload Xcode diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios/**/xcodebuild.log
          if-no-files-found: ignore
