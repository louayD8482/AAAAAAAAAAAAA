name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Uses the project's actual bun.lock, so native optional deps
      # (lightningcss, @tailwindcss/oxide, etc.) resolve for this exact
      # runner instead of npm re-resolving them from scratch and missing
      # the correct Darwin binary.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify native build binaries resolved correctly
        run: node -e "require.resolve('lightningcss'); console.log('lightningcss OK')"

      - name: Build Web Assets
        run: bun run build

      - name: Install Capacitor CLI
        run: bun add @capacitor/cli @capacitor/core @capacitor/ios

      # The ios/ folder is already committed to the repo (added and
      # customized previously), so "cap add ios" must not run again —
      # it only initializes a platform that doesn't exist yet.
      - name: Add Capacitor iOS Platform
        run: |
          if [ -d "ios" ]; then
            echo "ios/ already exists in repo — skipping cap add"
          else
            bunx cap add ios
          fi

      - name: Sync Capacitor iOS
        run: bunx cap sync ios

      - name: Build Xcode Archive
        run: |
          cd ios
          if [ -d "App" ]; then cd App; fi
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | head -n 1)
          if [ -z "$WORKSPACE" ]; then
            PROJECT=$(ls -d *.xcodeproj 2>/dev/null | head -n 1)
            xcodebuild -project "$PROJECT" -scheme App -configuration Release -archivePath build/App.xcarchive archive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO
          else
            xcodebuild -workspace "$WORKSPACE" -scheme App -configuration Release -archivePath build/App.xcarchive archive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO
          fi

      - name: Upload iOS Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive
          path: ios/**/build/App.xcarchive
